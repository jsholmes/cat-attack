# Deploys the Dino Attack multiplayer server (dino-server/) to Cloudflare when it changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (an "Edit Cloudflare Workers" token) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy Dino Attack server
on:
  push:
    branches: [main]
    paths: ["dino-server/**", ".github/workflows/deploy-dino-server.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # skip quietly until the Cloudflare secrets are added (the server was first deployed by hand with wrangler)
      - if: env.HAS_TOKEN != 'true'
        run: echo "No CLOUDFLARE_API_TOKEN secret yet, so skipping the deploy."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: dino-server
          wranglerVersion: "4.166.0"
          command: deploy
